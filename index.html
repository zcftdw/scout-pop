<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scout POP</title>
<style>
:root{
  --bg:#E2D2B1; --bg-line:#D2C19E; --bubble:#FFFFFF; --text:#1F1F1F; --sub:#6E6455;
  --badge:#2A2A2A; --pill:rgba(110,85,45,.13); --heart:#E8505B; --accent:#A88654; --input:#EFEFEF;
  --on-bg:#1F1F1F; --on-bg-sub:#5c5345; --page:#cbbb98; --bg-a:rgba(226,210,177,.86);
  --bottom:#FFFFFF; --input-line:#dcdcdc; --sheet:#FFFFFF; --sheet-text:#1F1F1F; --sheet-sub:#555; --sheet-line:#ece6da;
  --chip:#f1f1f1; --field:#faf8f3; --field-line:#e2dccf; --btn:#2b2b2b; --btn-text:#fff; --btn-sub:#f1ede4; --btn-sub-text:#333;
  --muted:#c4c4c4; --tr-line:#eeeeee; --tr-text:#8d8d8d; --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg) center/cover no-repeat;display:flex;flex-direction:column;overflow:hidden}

/* 상단 */
.top{flex:none;position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--bg-line);min-height:64px;color:var(--on-bg)}
.top .set-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--on-bg)}
.top .set-btn svg{width:24px;height:24px}
.top .ttl{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;text-align:center;white-space:nowrap}
.top .ttl .nm{font-size:19px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.top .ttl .nm svg{width:16px;height:16px;color:var(--on-bg-sub)}
.top .ttl .dd{font-size:13px;color:var(--on-bg-sub);margin-top:1px}
.top .icons{display:flex;gap:0}
.top .icons button{width:34px;height:36px;display:flex;align-items:center;justify-content:center}
.top .icons svg{width:22px;height:22px}
.top .icons button.on{color:var(--accent)}

/* 대화 */
.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 18px;scroll-behavior:auto}
.date{display:flex;justify-content:center;margin:18px 0 6px;scroll-margin-top:8px}
.date span{background:var(--pill);font-size:12.5px;padding:5px 13px;border-radius:999px;color:var(--on-bg-sub)}
.grp{display:flex;gap:10px;padding:10px 14px 2px}
.grp .av{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer}
.grp .body{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;height:20px;margin-top:1px}
.meta .nm{font-weight:500;color:var(--on-bg)}
.meta .badge{width:17px;height:17px;flex:none;color:var(--on-bg)}
.app.has-bg .meta .badge{color:#2A2A2A}
.meta .tm{color:var(--on-bg-sub);font-size:12.5px;margin-left:2px}
.row{display:flex;align-items:center;gap:6px;margin-top:7px}
.bub{background:var(--bubble);border-radius:22px;padding:10px 17px;font-size:calc(16px * var(--fs));line-height:1.45;max-width:calc(100% - 38px);word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.reply{padding:12px 18px 12px}
.rq-label{font-size:calc(14px * var(--fs));font-weight:600}
.rq{font-size:calc(14px * var(--fs));color:#a7a7a7;margin-top:2px}
.ra{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.ra svg{width:18px;height:18px;flex:none;margin-top:4px}
.ph{display:block;border-radius:16px;overflow:hidden;width:220px;max-width:calc(100% - 38px);background:var(--bubble)}
.ph img,.ph video{display:block;width:100%;height:auto}
.ph.vid{position:relative}
.ph .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding-left:4px}
.stk{width:118px;color:var(--on-bg)}
.stk svg,.stk img{display:block;width:100%;height:auto}
.hb{flex:none;width:30px;height:30px;margin-left:auto;display:flex;align-items:center;justify-content:center;color:var(--on-bg-sub)}
.hb svg{width:20px;height:20px}
.hb.on{color:var(--heart)}
.row.flash .bub,.row.flash .ph,.row.flash .stk{animation:flash 1.8s ease}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* 배경 사진 적용 시 */
.app.has-bg .top{background:var(--bg-a);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.app.has-bg .date span{background:rgba(255,255,255,.75);color:#5b4f3c}
.app.has-bg .meta .nm{color:#2c2c2c}.app.has-bg .meta .tm{color:#5c5345}
.app.has-bg .meta{background:rgba(255,255,255,.7);border-radius:10px;padding:0 8px;display:inline-flex}

/* 하단 입력창(장식) */
.bottom{flex:none;background:var(--bottom);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.fake-input{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--input);border:1px solid var(--input-line);border-radius:999px;padding:11px 14px 11px 18px;color:#9a9a9a;font-size:15.5px}
.fake-input svg{width:26px;height:26px;color:var(--on-bg-sub)}

/* 시트(아래에서 올라오는 창) */
.ov{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.38);visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.ov.show{visibility:visible;opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);color:var(--sheet-text);border-radius:24px 24px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
.ov.show .sheet{transform:none}
.sheet .handle{width:40px;height:4px;border-radius:4px;background:var(--sheet-line);margin:10px auto 0;flex:none}
.sheet .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;z-index:2}
.sheet .x svg{width:16px;height:16px}
.sheet-body{overflow-y:auto;padding:6px 18px calc(20px + env(safe-area-inset-bottom))}
.sh-title{font-size:17px;font-weight:700;text-align:center;margin:12px 0 16px}
.empty{color:#999;text-align:center;font-size:14px;padding:28px 0}

/* 프로필 */
.prof{text-align:center;margin-top:16px}
.prof img{width:76px;height:76px;border-radius:50%;object-fit:cover}
.prof .pn{font-size:18px;font-weight:700;margin-top:8px}
.prof .pd{font-size:13px;color:#888;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#777;margin:22px 0 8px}
.sec-h button{color:#2f6f4e;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs button,.gal button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.thumbs img,.gal img{width:100%;height:100%;object-fit:cover;display:block}
.menu{list-style:none;margin-top:12px}
.menu button{width:100%;text-align:left;padding:16px 2px;border-bottom:1px solid var(--sheet-line);font-size:16px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}

/* 입력 */
.field{width:100%;border:1.5px solid var(--field-line);border-radius:14px;padding:13px 15px;font-size:16px;outline:none;background:var(--field);color:var(--sheet-text)}
.field:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600;margin-top:10px}
.btn.sub{background:var(--btn-sub);color:var(--btn-sub-text)}
.hint{font-size:12.5px;color:#999;margin-top:8px;text-align:center}
.swatches.locked .swatch{opacity:.55;pointer-events:none}
textarea.field{min-height:78px;resize:vertical;font-family:inherit;line-height:1.45}
.ed-l{display:block;font-size:13px;color:var(--sheet-sub);margin:12px 2px 6px;font-weight:600}
.ed-when{font-size:13px;color:var(--sheet-sub);text-align:center;margin:-4px 0 4px}
.btn.warn{background:#f6e3e1;color:#b3261e}

/* 검색 결과 / 하트 목록 */
.res{list-style:none;margin-top:12px}
.res button{width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--sheet-line);display:block}
.res .rd{font-size:12px;color:#999}
.res .rt{font-size:15px;margin-top:3px;line-height:1.4;word-break:break-word}
.res mark{background:#f5e3b8;color:#222;border-radius:3px;padding:0 1px}

/* 달력 */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px}
.cal-nav button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-nav button:disabled{opacity:.25;cursor:default}
.cal-nav svg{width:18px;height:18px}
.cal-nav .ym{font-size:17px;font-weight:700;min-width:120px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-size:12px;color:#999;padding:4px 0}
.cd{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14.5px;color:var(--muted);position:relative;cursor:default}
.cd.has{color:var(--sheet-text);font-weight:600;cursor:pointer}
.cd.has::after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* 1년 전 오늘 */
.oy{background:var(--bg);color:var(--on-bg);border-radius:20px;padding:20px 16px 16px;margin-top:10px}
.oy .oy-h{text-align:center;font-size:13px;color:var(--on-bg-sub);letter-spacing:.08em}
.oy .oy-t{text-align:center;font-size:20px;font-weight:700;margin-top:4px}
.oy .oy-d{text-align:center;font-size:13px;color:var(--on-bg-sub);margin-top:4px}
.oy .oy-list{margin-top:12px}
.oy .oy-more{text-align:center;color:var(--on-bg-sub);font-size:13px;margin-top:8px}

/* 입장 화면 */
.gate{position:absolute;inset:0;z-index:50;background:var(--bg);color:var(--on-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 30px}
.gate.hide{display:none}
.gate img{width:88px;height:88px;border-radius:50%;object-fit:cover;box-shadow:0 4px 16px rgba(80,60,30,.18)}
.gate .g1{font-size:22px;font-weight:700;margin-top:16px}
.gate .g2{font-size:14px;color:var(--on-bg-sub);margin-top:6px;margin-bottom:22px}
.gate form{width:100%;max-width:320px}
.gate .field{background:var(--bubble);border-color:var(--bubble);color:var(--text);text-align:center}

/* 사진 크게 보기 */
.viewer{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:rgba(30,30,30,.88);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden-file{display:none}

/* 번역 */
.tr{font-size:calc(14px * var(--fs));color:var(--tr-text);margin-top:5px;padding-top:5px;border-top:1px solid var(--tr-line);line-height:1.4}
.rq .tr{border-top:0;padding-top:0;margin-top:1px;font-size:calc(12.5px * var(--fs));color:#bdbdbd}
.bub[data-tr]{cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--sheet-line);font-size:16px;width:100%;text-align:left}
.opt small{display:block;font-size:12.5px;color:#999;margin-top:3px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:#ddd;position:relative;transition:.2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--btn)}.sw.on::after{left:23px}

/* 글씨 크기 */
.fs-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--chip);border-radius:14px;padding:4px}
.fs-seg button{padding:10px 0;border-radius:10px;color:var(--sheet-sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.fs-seg button b{font-weight:600;line-height:1}
.fs-seg button span{font-size:12px}
.fs-seg button.sel{background:var(--sheet);color:var(--sheet-text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fs-prev{margin-top:16px;border-radius:16px;padding:14px;background:var(--bg)}
.fs-prev .bub{display:inline-block}

/* 테마 색 */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--sheet-sub);padding:12px 0;border-radius:16px;border:1.5px solid var(--sheet-line)}
.swatch.sel{border-color:var(--sheet-text);color:var(--sheet-text);font-weight:600}
.swatch i{width:64px;height:84px;border-radius:12px;border:1px solid rgba(0,0,0,.12);display:block;position:relative;overflow:hidden}
.swatch i::before,.swatch i::after{content:'';position:absolute;left:8px;height:12px;border-radius:6px;background:var(--b)}
.swatch i::before{top:18px;width:36px}.swatch i::after{top:36px;width:26px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="set-btn" data-open="settings" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="ttl">
      <div class="nm"><span id="ttlName"></span></div>
      <div class="dd" id="ttlDays"></div>
    </div>
    <div class="icons">
      <button data-act="tr-toggle" id="trBtn" aria-label="翻译"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="11" rx="2.5"/><path d="M5.5 11l2.5-6 2.5 6M6.3 9.2h3.4"/><rect x="10.5" y="10" width="11" height="11" rx="2.5" fill="var(--bg)"/><path d="M13.5 13.5h5M16 12.3v1.2M14.2 19c2.2-1 3.5-3 3.8-5.5M15 15.8c.8 1.4 2 2.5 3.5 3.2"/></svg></button>
      <button data-open="search" aria-label="搜索对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button data-open="calendar" aria-label="日历"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <footer class="bottom">
    <button class="fake-input" id="fakeInput"><span>发送消息</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="13" r="8"/><path d="M8.3 11.5h.01M13.7 11.5h.01"/><path d="M8 15.3c1.6 1.6 4.4 1.6 6 0"/><path d="M19.5 2.5v5M17 5h5"/></svg></button>
  </footer>

  <div class="ov" id="ov">
    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <button class="x" id="sheetX" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="gate hide" id="gate">
    <img class="av-img" alt="">
    <div class="g1" id="gateTitle"></div>
    <div class="g2">设置昵称后进入</div>
    <form id="gateForm">
      <input class="field" id="gateNick" maxlength="12" placeholder="输入昵称" autocomplete="off">
      <button class="btn" type="submit">进入</button>
      <div class="hint">昵称只保存在本设备上</div>
    </form>
  </div>

  <div class="viewer" id="viewer"><img id="viewerImg" alt=""><video id="viewerVid" controls playsinline style="display:none;max-width:100%;max-height:100%"></video></div>
  <div class="toast" id="toast"></div>
  <input type="file" accept="image/*" class="hidden-file" id="fileAvatar">
  <input type="file" accept="image/*" class="hidden-file" id="fileBg">

/* 사진 줄여서 저장 */
function readResized(file, max, square){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'), w = img.width, h = img.height, ctx = c.getContext('2d');
        if (square){ const s = Math.min(w, h); c.width = c.height = max; ctx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, max, max); }
        else { const r = Math.min(1, max / Math.max(w, h)); c.width = Math.round(w * r); c.height = Math.round(h * r); ctx.drawImage(img, 0, 0, c.width, c.height); }
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* 클릭 처리 */
function openView(id){
  const p = sorted[id]; if (!p) return;
  if (p.vsrc){ $('#viewerImg').style.display = 'none'; $('#viewerVid').style.display = 'block'; $('#viewerVid').src = p.vsrc; $('#viewerVid').poster = p.src; }
  else { $('#viewerVid').style.display = 'none'; $('#viewerVid').removeAttribute('src'); $('#viewerImg').style.display = 'block'; $('#viewerImg').src = p.src; }
  $('#viewer').classList.add('show');
}
$('#viewer').onclick = e => { if (e.target.id === 'viewerVid') return; $('#viewer').classList.remove('show'); const v = $('#viewerVid'); v.pause && v.pause(); };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-fs],[data-open],[data-heart],[data-view],[data-go],[data-day],[data-day-go],[data-act],[data-pick-theme],[data-tr]');
  if (!t) return;
  if (t.dataset.open === 'settings') return openSheet(settingsHtml());
  if (t.dataset.open === 'search'){ openSheet(searchHtml()); setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 260); return; }
  if (t.dataset.open === 'calendar'){ const [y, m] = lastYM.split('-').map(Number); calY = y; calM = m - 1; return openSheet(calHtml()); }
  if (t.dataset.heart !== undefined){
    const p = sorted[+t.dataset.heart]; if (!p) return;
    if (hearts.has(p.key)) hearts.delete(p.key); else hearts.add(p.key);
    store.set('hearts', [...hearts]);
    const on = hearts.has(p.key); t.classList.toggle('on', on); t.innerHTML = on ? ICON.heartFill : ICON.heartLine;
    return;
  }
  if (t.dataset.view !== undefined) return openView(+t.dataset.view);
  if (t.dataset.fs){ fs = +t.dataset.fs; store.set('fs', fs); applyFs(); sheetBody.innerHTML = fsHtml(); return; }
  if (t.dataset.pickTheme && THEMES[t.dataset.pickTheme]){ setTheme(t.dataset.pickTheme); themeUnlock = false; closeSheet(); return toast('已更换主题'); }
  if (t.dataset.tr !== undefined){
    if (autoTr) return;
    const id = +t.dataset.tr; if (openTr.has(id)) openTr.delete(id); else openTr.add(id);
    const row = document.getElementById('m-' + id); if (row) row.outerHTML = itemHtml(sorted[id]);
    return;
  }
  if (t.dataset.go !== undefined){ closeSheet(); return setTimeout(() => jumpTo(+t.dataset.go), 120); }
  if (t.dataset.day){ closeSheet(); return setTimeout(() => jumpDay(t.dataset.day), 120); }
  if (t.dataset.dayGo){ closeSheet(); return setTimeout(() => jumpDay(t.dataset.dayGo), 120); }
  switch (t.dataset.act){
    case 'gallery': return openSheet(galleryHtml());
    case 'nick': openSheet(nickHtml()); return setTimeout(() => { const i = $('#nickInput'); if (i) i.focus(); }, 260);
    case 'nick-save': {
      const v = ($('#nickInput').value || '').trim(); if (!v) return toast('请输入昵称');
      nick = v; store.set('nick', v); renderChat(true); closeSheet(); return toast('已修改昵称');
    }
    case 'tr': return openSheet(trHtmlSheet());
    case 'tr-toggle': {
      autoTr = !autoTr; store.set('autoTr', autoTr); openTr.clear(); refreshHeader(); renderChat(true);
      if (ov.classList.contains('show') && sheetBody.querySelector('.opt')) sheetBody.innerHTML = trHtmlSheet();
      else toast(autoTr ? '已开启翻译' : '已关闭翻译');
      return;
    }
    case 'theme': themeUnlock = false; return openSheet(themeHtml());
    case 'theme-unlock': themeUnlock = true; sheetBody.innerHTML = themeHtml(); return;
    case 'fs': return openSheet(fsHtml());
    case 'avatar': return openSheet(photoSetHtml('avatar'));
    case 'bg': return openSheet(photoSetHtml('bg'));
    case 'avatar-pick': return $('#fileAvatar').click();
    case 'bg-pick': return $('#fileBg').click();
    case 'avatar-reset': store.del('avatar'); refreshHeader(); renderChat(true); closeSheet(); return toast('已恢复默认头像');
    case 'bg-reset': store.del('bg'); applyBg(); closeSheet(); return toast('已恢复默认背景');
    case 'cal-prev': calM--; if (calM < 0){ calM = 11; calY--; } sheetBody.innerHTML = calHtml(); return;
    case 'cal-next': calM++; if (calM > 11){ calM = 0; calY++; } sheetBody.innerHTML = calHtml(); return;
    case 'last': { closeSheet(); const c = $('#chat'); return setTimeout(() => c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' }), 120); }
  }
});
sheetBody.addEventListener('input', e => {
  if (e.target.id === 'q') $('#qres').innerHTML = searchResults(e.target.value);
});
sheetBody.addEventListener('keydown', e => { if (e.target.id === 'nickInput' && e.key === 'Enter'){ e.preventDefault(); sheetBody.querySelector('[data-act="nick-save"]').click(); } });
$('#fakeInput').onclick = () => toast('这是备份页面，不能发送消息');

/* 입장 */
$('#gateForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#gateNick').value.trim(); if (!v) return toast('请输入昵称');
  nick = v; store.set('nick', v); $('#gate').classList.add('hide'); renderChat(); setTimeout(() => checkOneYear(location.hash === '#oneyear-preview'), 400);
});

/* 시작 */
rebuild();
applyTheme(); applyFs(); refreshHeader(); applyBg(); renderChat();
if (!nick) $('#gate').classList.remove('hide');
else setTimeout(() => checkOneYear(location.hash === '#oneyear-preview'), 400);
window.addEventListener('hashchange', () => { if (location.hash === '#oneyear-preview') checkOneYear(true); });
</script>
</body>
</html>
